<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R20 API BY NELL</title>
    <meta property="og:title" content="R20 API BY NELL" />
    <meta name="twitter:title" content="R20 API BY NELL" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <h1 class="eyebrow" lang="en">Roll20 API script by nell</h1>
        </div>
      </header>

      <div class="workspace">
        <section class="module-panel" aria-labelledby="module-heading">
          <h2 class="sr-only" id="module-heading">선택 가능한 스크립트</h2>
          <div class="module-list" id="module-list"></div>
        </section>

        <section class="preview-panel" aria-labelledby="preview-heading">
          <div class="preview-toolbar">
            <h2 id="preview-heading" lang="en">R20 API</h2>
            <span lang="en">LIVE PREVIEW</span>
          </div>
          <div class="preview-document-bar">
            <strong lang="en">roll20-api.js</strong>
            <output id="preview-meta" lang="en">0 modules</output>
          </div>
          <textarea
            class="code-preview"
            id="code-preview"
            aria-label="생성된 Roll20 API 코드"
            readonly
            spellcheck="false"
          ></textarea>
          <div class="preview-actions">
            <button class="copy-button" id="copy-code" type="button">복사</button>
            <output
              class="sr-only"
              id="copy-status"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            ></output>
          </div>
        </section>
      </div>

    </main>

    <script type="module" src="src/scriptMixer.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
